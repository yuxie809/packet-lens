<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#f8e8f5"><title>跃环 · GLCM ORBIT</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#59446c;background:radial-gradient(ellipse at 50% 42%,#fff5fa,#f8e8f5 58%,#f1e2f1);touch-action:manipulation;user-select:none}#scene{position:absolute;inset:0;width:100%;height:100%;display:block}.hud{position:absolute;top:max(22px,env(safe-area-inset-top));left:0;width:100%;display:flex;flex-direction:column;align-items:center;pointer-events:none}.score{font-size:clamp(72px,17vw,112px);line-height:.95;font-weight:900;letter-spacing:-.075em;color:#795b91;text-shadow:0 3px 0 #fff8}.target{font-size:22px;font-weight:850;color:#4c3d50;margin-top:7px}.progress{width:min(250px,64vw);height:10px;border-radius:20px;background:#b9aeb8;margin-top:10px;overflow:hidden}.fill{height:100%;width:0;background:#fff;border-radius:20px;box-shadow:0 0 8px #fff;transition:width .2s}.back{position:absolute;top:max(125px,16vh);left:22px;border:0;background:transparent;color:#795b91;font-size:40px;pointer-events:auto}.tip{position:absolute;top:calc(max(22px,env(safe-area-inset-top)) + 165px);width:100%;text-align:center;font-size:12px;color:#927e98;pointer-events:none}.bottom{position:absolute;bottom:max(14px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(94vw,440px);display:flex;align-items:center;gap:8px;justify-content:center}.glcm{background:#fff9f0ce;border:1px solid #e8d9e7;border-radius:16px;padding:8px 10px;display:flex;align-items:center;gap:8px;box-shadow:0 5px 18px #765b7020;backdrop-filter:blur(8px)}.glcm-label{font-size:10px;line-height:1.35;color:#8a718f;white-space:nowrap}.glcm-label b{display:block;font-size:12px;color:#644d78}.mini{display:grid;grid-template-columns:repeat(6,6px);gap:2px}.mini i{width:6px;height:6px;border-radius:2px;background:#b78b62}.action{border:0;border-radius:14px;background:#795b91;color:white;font-weight:800;font-size:13px;padding:13px 14px;box-shadow:0 5px 12px #765b7030;white-space:nowrap}.toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;width:min(82vw,320px);padding:22px 18px;border-radius:22px;background:#fffaf2ef;border:1px solid #efdfec;box-shadow:0 14px 40px #7b5e7625;backdrop-filter:blur(10px);pointer-events:none}.toast h1{font-size:25px;margin:0 0 7px;color:#76588d}.toast p{font-size:13px;line-height:1.65;color:#907e92;margin:0}.toast.hide{display:none}
</style></head><body><canvas id="scene"></canvas><div class="hud"><div class="score" id="score">0</div><div class="target">目标：10</div><div class="progress"><div class="fill" id="fill"></div></div></div><button class="back" id="back">‹</button><div class="tip" id="tip">轻点屏幕，让小骑士跃过障碍</div><div class="bottom"><div class="glcm"><div class="glcm-label">实时纹理分析<b>GLCM · 6 灰度级</b></div><div class="mini" id="mini"></div><div class="glcm-label">对比度<b id="contrast">—</b></div><div class="glcm-label">能量<b id="energy">—</b></div></div><button class="action" id="start">开始游戏</button></div><div class="toast" id="toast"><h1>跃环出发</h1><p>沿着星环奔跑，点击屏幕跳过坚果障碍。<br>地面纹理生成灰度共生矩阵，<br>并影响本轮跳跃力度。</p></div>
<script>
(()=>{
const c=document.querySelector('#scene'),x=c.getContext('2d'),$=id=>document.getElementById(id);let w,h,dpr,cx,cy,R,angle=-1.05,run=false,ended=false,jump=0,score=0,last=0,speed=.78,power=.72,items=[],mat=[],feat={contrast:0,energy:0},raf=0;
const tau=Math.PI*2;
function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;c.width=w*dpr;c.height=h*dpr;x.setTransform(dpr,0,0,dpr,0,0);cx=w/2;cy=h*.505;R=Math.min(w*.355,h*.205,175);draw()}
addEventListener('resize',resize);
function glcm(seed=Math.random()*20){let a=Array.from({length:20},(_,y)=>Array.from({length:30},(_,z)=>Math.max(0,Math.min(5,Math.floor((Math.sin(z*.55+seed)*.8+Math.cos(y*.7-seed)*.5+Math.sin((z+y)*.27)*.35+(Math.random()-.5)*.4+1.6)/3.2*6)))));mat=Array.from({length:6},()=>Array(6).fill(0));let n=0;for(let y=0;y<a.length;y++)for(let z=0;z<a[0].length-1;z++){mat[a[y][z]][a[y][z+1]]++;n++}mat=mat.map(r=>r.map(v=>v/n));let con=0,en=0,hom=0;for(let i=0;i<6;i++)for(let j=0;j<6;j++){let p=mat[i][j];con+=(i-j)**2*p;en+=p*p;hom+=p/(1+Math.abs(i-j))}feat={contrast:con,energy:en};power=Math.max(.62,Math.min(.95,.66+con*.018+(hom-.35)*.12));$('contrast').textContent=con.toFixed(2);$('energy').textContent=en.toFixed(3);$('mini').innerHTML='';mat.flat().forEach(v=>{let e=document.createElement('i');e.style.background='rgb('+Math.round(245-v*90)+','+Math.round(211-v*105)+','+Math.round(142-v*85)+')';$('mini').append(e)})}
function reset(){cancelAnimationFrame(raf);angle=-1.05;jump=0;score=0;speed=.78;run=true;ended=false;items=[];for(let i=0;i<8;i++)items.push({a:i*tau/8+.28,type:i%3===1?'glow':'nut',hit:false});glcm();$('score').textContent='0';$('fill').style.width='0%';$('start').textContent='跳跃';$('toast').classList.add('hide');$('tip').textContent='点击任意位置跳跃 · 避开障碍';last=performance.now();raf=requestAnimationFrame(loop)}
function hop(){if(!run){if(ended)reset();return}if(jump<=0)jump=power}
function pos(a,r){return{x:cx+Math.cos(a)*r,y:cy+Math.sin(a)*r}}
function cloud(a,b,s){x.save();x.translate(a,b);x.scale(s,s);x.fillStyle='#fff9ef';x.beginPath();x.arc(-28,4,20,0,Math.PI*2);x.arc(-8,-8,24,0,Math.PI*2);x.arc(16,0,19,0,Math.PI*2);x.arc(32,7,14,0,Math.PI*2);x.fill();x.restore()}
function star(a,b,r){x.save();x.translate(a,b);x.fillStyle='#f6d777';x.beginPath();for(let i=0;i<10;i++){let q=-Math.PI/2+i*Math.PI/5,v=i%2?r*.48:r;x.lineTo(Math.cos(q)*v,Math.sin(q)*v)}x.closePath();x.fill();x.restore()}
function knight(a,b,ang,air){x.save();x.translate(a,b-(air?13:0));x.rotate(ang+Math.PI/2);x.fillStyle='#6b4c3c';x.beginPath();x.ellipse(0,8,10,7,0,0,Math.PI*2);x.fill();x.fillStyle='#e9a18a';x.beginPath();x.arc(0,-2,9,0,Math.PI*2);x.fill();x.fillStyle='#f4c6a2';x.beginPath();x.arc(-2,-4,6,0,Math.PI*2);x.fill();x.fillStyle='#267b54';x.beginPath();x.arc(0,-7,10,Math.PI,Math.PI*2);x.lineTo(10,-5);x.lineTo(-10,-5);x.fill();x.fillRect(-8,-7,17,4);x.fillStyle='#f7d36e';x.fillRect(-2,-10,4,3);x.fillStyle='#49394c';x.beginPath();x.arc(3,-2,1.4,0,Math.PI*2);x.fill();x.restore()}
function draw(){if(!w)return;x.clearRect(0,0,w,h);let g=x.createLinearGradient(0,0,w,h);g.addColorStop(0,'#f9eafa');g.addColorStop(.52,'#f8e8f5');g.addColorStop(1,'#f1e4f2');x.fillStyle=g;x.fillRect(0,0,w,h);star(w*.19,h*.06,20);star(w*.73,h*.15,24);star(w*.84,h*.66,28);star(w*.2,h*.77,25);star(w*.82,h*.42,18);cloud(w*.4,h*.055,.85);cloud(w*.12,h*.36,.95);cloud(w*.83,h*.8,1.1);cloud(w*.38,h*.54,.75);x.save();x.shadowColor='#caa65d55';x.shadowBlur=5;x.beginPath();x.arc(cx,cy,R,0,tau);x.strokeStyle='#d7b75f';x.lineWidth=10;x.stroke();x.beginPath();x.arc(cx,cy,R,0,tau);x.strokeStyle='#ffe59a';x.lineWidth=6;x.stroke();x.restore();for(let i=0;i<24;i++){let p=pos(i*tau/24,R);x.fillStyle='#fff8e8';x.beginPath();x.arc(p.x,p.y,2,0,tau);x.fill()}for(let it of items){let p=pos(it.a,R);if(it.type==='nut'){x.fillStyle='#a9773d';x.beginPath();x.ellipse(p.x,p.y,9,12,0,0,tau);x.fill();x.fillStyle='#f7e8c9';x.fillRect(p.x-4,p.y-13,8,3)}else{x.fillStyle='#f27d27';x.beginPath();x.ellipse(p.x,p.y,9,11,0,0,tau);x.fill();x.fillStyle='#ffc06c';x.beginPath();x.arc(p.x-2,p.y-3,2,0,tau);x.fill()}}let p=pos(angle,R);knight(p.x,p.y,angle,jump>0)}
function finish(){run=false;ended=true;$('start').textContent='再玩一次';$('tip').textContent='点击再玩一次';$('toast').classList.remove('hide');$('toast').innerHTML='<h1>'+(score>=10?'成功抵达！':'再试一次')+'</h1><p>本轮得分：'+score+' / 10<br>GLCM 对比度 '+feat.contrast.toFixed(2)+' · 能量 '+feat.energy.toFixed(3)+'<br>点击「再玩一次」重新挑战</p>'}
function loop(t){if(!run)return;let dt=Math.min(.04,(t-last)/1000);last=t;let old=angle;angle=(angle+speed*dt)%tau;if(jump>0)jump=Math.max(0,jump-dt);for(let it of items){let d=(it.a-old+tau)%tau;if(!it.hit&&d<speed*dt+.012){it.hit=true;if(jump<=.04){finish();break}score++;$('score').textContent=score;$('fill').style.width=(score*10)+'%';if(score%3===0)glcm()}}if(score>=10)finish();if(run)draw();raf=requestAnimationFrame(loop)}
c.addEventListener('pointerdown',e=>{e.preventDefault();hop()},{passive:false});$('start').addEventListener('click',()=>{if(!run)reset();else hop()});$('back').addEventListener('click',()=>{if(run){run=false;$('start').textContent='继续';$('tip').textContent='已暂停 · 点击继续'}else reset()});addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();hop()}});glcm(3.14);resize();draw();
})();
</script></body></html>
