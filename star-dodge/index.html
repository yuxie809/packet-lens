<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#080c18" />
<title>星际闪避 · HTML 小游戏</title>
<style>
  :root{color-scheme:dark;--ink:#eaf3ff;--muted:#98a7c7;--cyan:#72f6e9;--gold:#ffd56b;--red:#ff6682}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden;background:#080c18;font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink)}
  body{display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 0%,#1c2a50 0%,#080c18 62%)}
  .frame{position:relative;width:min(100vw,510px);height:min(100dvh,870px);max-height:100dvh;overflow:hidden;background:linear-gradient(180deg,#101c37 0%,#080c18 100%);border:1px solid #293754;box-shadow:0 22px 75px #0007;isolation:isolate}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  .topbar{position:absolute;z-index:2;top:max(15px,env(safe-area-inset-top));left:17px;right:17px;display:flex;align-items:flex-start;justify-content:space-between;pointer-events:none}
  .metric{background:#0c162bbd;border:1px solid #34435e;border-radius:13px;padding:8px 13px;backdrop-filter:blur(10px);min-width:102px}
  .metric small{display:block;font-size:11px;letter-spacing:2px;color:var(--muted);margin-bottom:3px}
  .metric strong{font-size:24px;font-variant-numeric:tabular-nums;line-height:1.1}
  .right{display:flex;align-items:start;gap:8px}
  .pause{pointer-events:auto;border:1px solid #34435e;background:#0c162bc9;color:var(--ink);border-radius:13px;min-width:45px;height:49px;font-size:22px;cursor:pointer;touch-action:manipulation}
  .pause:focus-visible,.action:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}
  .hint{position:absolute;z-index:2;bottom:max(18px,env(safe-area-inset-bottom));width:100%;text-align:center;color:#95a6c8;font-size:12px;letter-spacing:.3px;pointer-events:none;text-shadow:0 1px 3px #060b19}
  .shade{position:absolute;z-index:4;inset:0;background:#080e1dc4;backdrop-filter:blur(6px);display:flex;justify-content:center;align-items:center;padding:24px}
  .shade[hidden]{display:none}
  .panel{width:100%;max-width:370px;text-align:center;padding:32px 22px 29px;background:linear-gradient(150deg,#182743ef,#0d162bfa);border:1px solid #3a4a6c;border-radius:24px;box-shadow:0 23px 70px #0007}
  .crest{display:inline-grid;place-items:center;width:68px;height:68px;font-size:37px;border-radius:22px;background:#243857;border:1px solid #416486;margin-bottom:15px}
  h1{font-size:clamp(30px,7vw,39px);letter-spacing:3px;margin:0 0 9px;line-height:1.3}
  .subtitle{font-size:14px;line-height:1.85;color:#b8c8e3;margin:0 0 18px}
  .rules{display:flex;gap:9px;justify-content:center;margin:0 0 24px;flex-wrap:wrap}
  .rules span{font-size:12px;background:#243451;border:1px solid #395173;padding:8px 11px;border-radius:99px}
  .action{border:0;border-radius:13px;background:var(--cyan);color:#09232a;font-size:16px;font-weight:800;letter-spacing:1px;min-height:51px;width:100%;cursor:pointer;box-shadow:0 5px 24px #72f6e929;touch-action:manipulation}
  .action:active{transform:translateY(1px);filter:brightness(.92)}
  .mini{color:var(--muted);font-size:12px;line-height:1.8;margin:16px 0 0}
  .final{font-size:27px;font-weight:800;color:var(--gold);margin:0 0 18px}
  .final small{font-size:13px;color:#9cb0cf;font-weight:400}
  @media(max-width:520px){.frame{border:none;border-radius:0}.panel{padding:28px 20px}.metric{min-width:93px;padding:8px 10px}.metric strong{font-size:21px}}
  @media(prefers-reduced-motion:reduce){.shade{backdrop-filter:none}}
</style>
</head>
<body>
<main class="frame" id="frame" aria-label="星际闪避游戏">
  <canvas id="game" aria-label="游戏区域：移动飞船，接住金色星星并躲避红色陨石"></canvas>
  <div class="topbar">
    <div class="metric"><small>得 分</small><strong id="score">0</strong></div>
    <div class="right">
      <div class="metric"><small>最高分</small><strong id="best">0</strong></div>
      <button id="pause" class="pause" aria-label="暂停游戏" title="暂停 / 继续">Ⅱ</button>
    </div>
  </div>
  <div class="hint" id="hint">拖动手指或使用 ← → / A D 移动 · 空格暂停</div>
  <section class="shade" id="overlay" aria-live="polite">
    <div class="panel">
      <div class="crest" id="crest" aria-hidden="true">✦</div>
      <h1 id="title">星际闪避</h1>
      <p class="subtitle" id="subtitle">驾驶飞船穿过流星雨。<br>能坚持多久，就看你的操作了。</p>
      <div class="rules" id="rules"><span>✦ 接星星 +10 分</span><span>☄ 躲陨石</span></div>
      <p class="final" id="final" hidden></p>
      <button class="action" id="start">开始游戏</button>
      <p class="mini" id="mini">手机：左右拖动飞船<br>电脑：← → 或 A D 移动</p>
    </div>
  </section>
</main>
<script>
(() => {
  'use strict';
  const frame = document.getElementById('frame');
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const pauseBtn = document.getElementById('pause');
  const overlay = document.getElementById('overlay');
  const titleEl = document.getElementById('title');
  const subEl = document.getElementById('subtitle');
  const crestEl = document.getElementById('crest');
  const rulesEl = document.getElementById('rules');
  const finalEl = document.getElementById('final');
  const startBtn = document.getElementById('start');
  const miniEl = document.getElementById('mini');
  let W=0,H=0,dpr=1,playing=false,paused=false,dead=false,lastTime=0,elapsed=0,score=0;
  let ship={x:0,y:0,r:17,tx:0}, drops=[],particles=[], stars=[],spawnTimer=0,shake=0;
  let best=0; try{ best=Number(localStorage.getItem('star-dodge-best')||0)||0; }catch(_e){}
  bestEl.textContent=best;
  const keys={left:false,right:false};
  let pointerDown=false;
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  const rnd=(a,b)=>a+Math.random()*(b-a);
  function resize(){
    const rect=frame.getBoundingClientRect();
    const oldW=W;
    W=Math.max(1,rect.width); H=Math.max(1,rect.height);
    dpr=Math.min(2,window.devicePixelRatio||1);
    canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    if(oldW){ship.x=clamp(ship.x*W/oldW,ship.r+6,W-ship.r-6);ship.tx=ship.x;}
    else{ship.x=ship.tx=W/2;}
    ship.y=H-105;
    stars=Array.from({length:65},()=>({x:rnd(0,W),y:rnd(0,H),r:rnd(.4,1.8),alpha:rnd(.15,.8),speed:rnd(8,35)}));
    paint();
  }
  function burst(x,y,color,count=10){
    for(let i=0;i<count;i++){
      const a=rnd(0,Math.PI*2),v=rnd(50,220);
      particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rnd(.3,.65),max:.65,color,r:rnd(1.5,4)});
    }
  }
  function reset(){
    drops=[];particles=[];elapsed=0;spawnTimer=0;score=0;shake=0;
    ship.x=ship.tx=W/2;ship.y=H-105;
    scoreEl.textContent='0'; playing=true;paused=false;dead=false;
    overlay.hidden=true;pauseBtn.textContent='Ⅱ';pauseBtn.setAttribute('aria-label','暂停游戏');
    lastTime=performance.now();
  }
  function showPanel(kind){
    overlay.hidden=false;
    if(kind==='paused'){
      crestEl.textContent='Ⅱ';titleEl.textContent='已暂停';subEl.innerHTML='休息一下，飞船会停在原地。';
      rulesEl.hidden=true;finalEl.hidden=true;startBtn.textContent='继续游戏';miniEl.textContent='按空格也能继续';
    }else if(kind==='over'){
      crestEl.textContent='✧';titleEl.textContent='飞行结束';subEl.textContent=score>=best&&score>0?'刷新纪录，干得漂亮！':'再试一次，突破最高分。';
      rulesEl.hidden=true;finalEl.hidden=false;finalEl.innerHTML=`${score} <small>分 · 最高 ${best} 分</small>`;
      startBtn.textContent='再玩一次';miniEl.textContent='每收集一颗星星加 10 分';
    }
  }
  function gameOver(){
    if(!playing)return;
    playing=false;dead=true;shake=13;burst(ship.x,ship.y,'#ff6682',28);
    if(score>best){best=score;bestEl.textContent=best;try{localStorage.setItem('star-dodge-best',String(best));}catch(_e){}}
    showPanel('over');
  }
  function togglePause(){
    if(dead||!playing)return;
    paused=!paused;
    if(paused){showPanel('paused');pauseBtn.textContent='▶';pauseBtn.setAttribute('aria-label','继续游戏');}
    else{overlay.hidden=true;pauseBtn.textContent='Ⅱ';pauseBtn.setAttribute('aria-label','暂停游戏');lastTime=performance.now();}
  }
  function spawn(){
    const gold=Math.random()<(0.35+Math.min(0.12,elapsed*.001));
    const r=gold?rnd(10,14):rnd(15,25);
    drops.push({x:rnd(r+9,W-r-9),y:-r-10,r,type:gold?'gold':'rock',speed:rnd(185,255)+Math.min(260,elapsed*4.1),rot:rnd(0,Math.PI*2),spin:rnd(-2.5,2.5),phase:rnd(0,7)});
  }
  function update(dt){
    elapsed+=dt;
    const speed=410;
    if(keys.left)ship.tx-=speed*dt;
    if(keys.right)ship.tx+=speed*dt;
    ship.tx=clamp(ship.tx,ship.r+8,W-ship.r-8);
    ship.x+= (ship.tx-ship.x)*Math.min(1,dt*16);
    const interval=Math.max(.26,.77-elapsed*.007);
    spawnTimer+=dt;
    while(spawnTimer>=interval){spawnTimer-=interval;spawn();}
    for(const s of stars){s.y+=s.speed*dt;if(s.y>H){s.y=0;s.x=rnd(0,W);}}
    for(let i=drops.length-1;i>=0;i--){
      const d=drops[i];d.y+=d.speed*dt;d.rot+=d.spin*dt;
      if(d.y-d.r>H){drops.splice(i,1);continue;}
      const dx=d.x-ship.x,dy=d.y-(ship.y-4);
      if(dx*dx+dy*dy<(d.r+ship.r-5)**2){
        drops.splice(i,1);
        if(d.type==='gold'){
          score+=10;scoreEl.textContent=score;
          burst(d.x,d.y,'#ffd56b',13);
          if(score>best){best=score;bestEl.textContent=best;try{localStorage.setItem('star-dodge-best',String(best));}catch(_e){}}
        }else{gameOver();break;}
      }
    }
    for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=140*dt;if(p.life<=0)particles.splice(i,1);}
    shake*=Math.max(0,1-dt*10);
  }
  function pathStar(x,y,r,rot=0){
    ctx.beginPath();for(let i=0;i<10;i++){const a=rot+i*Math.PI/5-Math.PI/2,rad=i%2?r*.46:r;const xx=x+Math.cos(a)*rad,yy=y+Math.sin(a)*rad;if(i===0)ctx.moveTo(xx,yy);else ctx.lineTo(xx,yy);}ctx.closePath();
  }
  function paint(){
    ctx.clearRect(0,0,W,H);
    ctx.save();
    if(shake>.3)ctx.translate(rnd(-shake,shake),rnd(-shake,shake));
    const grad=ctx.createLinearGradient(0,0,0,H);grad.addColorStop(0,'#101e3a');grad.addColorStop(1,'#080c18');
    ctx.fillStyle=grad;ctx.fillRect(-20,-20,W+40,H+40);
    // Nebula glow, faint grid and starfield.
    const neb=ctx.createRadialGradient(W*.8,H*.32,10,W*.8,H*.32,W*.7);neb.addColorStop(0,'#38427036');neb.addColorStop(1,'#38427000');
    ctx.fillStyle=neb;ctx.fillRect(0,0,W,H);
    ctx.strokeStyle='#42608714';ctx.lineWidth=1;
    for(let x=20;x<W;x+=38){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
    for(let y=14;y<H;y+=38){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
    for(const s of stars){ctx.globalAlpha=s.alpha;ctx.fillStyle='#d9e8ff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();}ctx.globalAlpha=1;
    for(const d of drops){
      if(d.type==='gold'){
        ctx.save();ctx.translate(d.x,d.y);ctx.rotate(d.rot);ctx.shadowColor='#ffd56b';ctx.shadowBlur=20;
        ctx.fillStyle='#ffd56b';pathStar(0,0,d.r);ctx.fill();ctx.shadowBlur=0;
        ctx.fillStyle='#fff4c7';pathStar(-1,-1,d.r*.47);ctx.fill();ctx.restore();
      }else{
        ctx.save();ctx.translate(d.x,d.y);ctx.rotate(d.rot);
        ctx.shadowColor='#ff546e';ctx.shadowBlur=15;ctx.fillStyle='#e95370';
        ctx.beginPath();const sides=9;for(let i=0;i<sides;i++){const a=i*Math.PI*2/sides;const rr=d.r*(i%2?.88:1);const x=Math.cos(a)*rr,y=Math.sin(a)*rr;if(!i)ctx.moveTo(x,y);else ctx.lineTo(x,y);}ctx.closePath();ctx.fill();ctx.shadowBlur=0;
        ctx.fillStyle='#8e304f';ctx.beginPath();ctx.arc(-d.r*.23,-d.r*.15,d.r*.25,0,Math.PI*2);ctx.arc(d.r*.32,d.r*.24,d.r*.16,0,Math.PI*2);ctx.fill();ctx.restore();
      }
    }
    // Ship with layered jet flame.
    if(!dead){
      ctx.save();ctx.translate(ship.x,ship.y);
      ctx.shadowColor='#72f6e9';ctx.shadowBlur=22;
      ctx.fillStyle='#4bd5d3';ctx.beginPath();ctx.moveTo(0,-25);ctx.lineTo(20,17);ctx.lineTo(6,12);ctx.lineTo(0,18);ctx.lineTo(-6,12);ctx.lineTo(-20,17);ctx.closePath();ctx.fill();
      ctx.shadowBlur=0;ctx.fillStyle='#e5fffc';ctx.beginPath();ctx.moveTo(0,-17);ctx.lineTo(7,3);ctx.lineTo(0,10);ctx.lineTo(-7,3);ctx.closePath();ctx.fill();
      if(playing&&!paused){ctx.fillStyle='#faab5d';ctx.beginPath();ctx.moveTo(-6,18);ctx.lineTo(0,18+rnd(14,27));ctx.lineTo(6,18);ctx.fill();ctx.fillStyle='#fff2bf';ctx.beginPath();ctx.moveTo(-3,17);ctx.lineTo(0,17+rnd(8,16));ctx.lineTo(3,17);ctx.fill();}
      ctx.restore();
    }
    for(const p of particles){ctx.globalAlpha=clamp(p.life/p.max,0,1);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();}ctx.globalAlpha=1;
    ctx.restore();
  }
  function tick(t){
    const dt=Math.min(.04,(t-lastTime)/1000||0);lastTime=t;
    if(playing&&!paused)update(dt);
    paint();requestAnimationFrame(tick);
  }
  function pointerX(ev){const rect=canvas.getBoundingClientRect();ship.tx=clamp(ev.clientX-rect.left,ship.r+8,W-ship.r-8);}
  canvas.addEventListener('pointerdown',e=>{pointerDown=true;pointerX(e);try{canvas.setPointerCapture(e.pointerId);}catch(_e){}});
  canvas.addEventListener('pointermove',e=>{if(pointerDown&&playing&&!paused)pointerX(e);});
  canvas.addEventListener('pointerup',()=>{pointerDown=false;});
  canvas.addEventListener('pointercancel',()=>{pointerDown=false;});
  window.addEventListener('keydown',e=>{
    if(['ArrowLeft','ArrowRight','Space','KeyA','KeyD'].includes(e.code))e.preventDefault();
    if(e.code==='ArrowLeft'||e.code==='KeyA')keys.left=true;
    if(e.code==='ArrowRight'||e.code==='KeyD')keys.right=true;
    if(e.code==='Space'&&!e.repeat){if(playing)togglePause();else if(!dead)reset();}
    if(e.code==='Enter'&&!playing&&!paused&&!e.repeat)reset();
  });
  window.addEventListener('keyup',e=>{if(e.code==='ArrowLeft'||e.code==='KeyA')keys.left=false;if(e.code==='ArrowRight'||e.code==='KeyD')keys.right=false;});
  window.addEventListener('blur',()=>{keys.left=false;keys.right=false;if(playing&&!paused)togglePause();});
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing&&!paused)togglePause();});
  pauseBtn.addEventListener('click',togglePause);
  startBtn.addEventListener('click',()=>{if(playing&&paused)togglePause();else reset();});
  window.addEventListener('resize',resize);
  resize();requestAnimationFrame(t=>{lastTime=t;requestAnimationFrame(tick);});
})();
</script>
</body>
</html>
